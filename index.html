<!DOCTYPE html>
<html>
<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Plus+Jakarta+Sans">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Space+Mono">


<body>

  <div class="window" id="welcome">
    <div class="handle" id="welcomeheader">
      <h2>Welcome.txt</h2>
      <button class="icon" id="close"><img src="resources\assets\icons\X.svg" alt="Close"></button>
    </div>
    <div class="content">
      <h1>Welcome to SigmaOS</h1>
      <p>
        This is Sigma<abbr title="Operating System">OS</abbr>, a place to learn more about me <br>
        and what weird stuff I've been up to.
      </p>

      <button class="button">Click me</button>
    </div>
  </div>

  <div id="desktopApps">
    <div class="app" id="welcomeApp">
      <img class="appImage" src="resources/assets/icons/notes.svg">
      <p>Welcome.txt</p>
    </div>
  </div>

  <div class="task-bar">
    <img class="pizza" src="resources\assets\pizza_slice.png" alt="Pizza Logo" width="75" height="75">
    <div class="spacer"></div>
    <p class="time" id="time">

    </p>
  </div>

  <script src="script.js"></script>
</body>

</html>
